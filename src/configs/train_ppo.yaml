# One network plays both colours on observations oriented to the mover (AlphaZero,
# Silver et al. 2017). false = legacy separate white/black networks.
shared_network: true
num_envs: 12
max_updates: 30000
# 64 plies x 12 boards = 768 samples per update (decided 2026-09-16; the paper
# uses ~1000). Use the same value in a2c arms when comparing algorithms.
steps_per_update: 64
# 3e-4 is the rate every run before 2026-09-16 effectively used from update 100 on
# (the old hard-coded floor 3e-4 sat above the 1e-4 start). Kept for comparability.
learning_rate: 0.0003
seed: 42
env_type: sync

gamma: 0.99
entropy_coef: 0.01
grad_clip: 1.0

# Reward shaping (Ng, Harada & Russell 1999). `potential`: each own move gets
# shaping_scale * (gamma * material(next own position) - material(this position)),
# terminal position counts as 0, so shaping nets to zero over a game and only the
# terminal outcome is real reward. `none`: outcome-only reward (scale 0).
shaping: potential
# 0.2 chosen 2026-09-15 from a single-seed 500-update comparison against 1.0:
# value head started to absorb the material offset (corr flipped negative) and
# decisive games rose 13% -> 24%. Revisit with more seeds.
shaping_scale: 0.2

# Start-position curriculum (Florensa et al. 2017; Salimans & Chen 2018).
# round(puzzle_fraction * num_envs) boards play one-move puzzle episodes from
# Lichess mate-in-one positions (mate = win, anything else = "puzzle_miss" paying
# the mover puzzle_miss_reward); the other boards play full games from the
# opening. 0 = today's training, 1 = no board ever sees an opening. 0.5 chosen by
# the owner 2026-09-16. Puzzle files: scripts/prepare_puzzles.py (Lichess DB, CC0).
puzzle_fraction: 0.5
# Explicit board count wins over the fraction. 4 of 12 chosen by the owner 2026-09-16.
puzzle_boards: 4
# Puzzle sources with weights. Lichess only (50k human-game positions) is the
# default after the 2026-09-16 A/B: mixing in positions harvested from the models'
# own games (scripts/harvest_positions.py) raised accuracy on those positions but
# lowered Lichess accuracy and did not move the in-game mate rate. To try the mix
# again, add {file: data/puzzles/selfplay_mate_in_1_train.csv, weight: 0.5}.
puzzle_train_files:
  - {file: data/puzzles/mate_in_1_train.csv, weight: 1.0}
# Terminal reward for a missed mate on a puzzle board. 0 (default) keeps the value
# head honest about still-winning positions; try negative values as an experiment.
puzzle_miss_reward: 0.0
# Held-out mate-in-one sets, reported as <name>_top1 / <name>_mate_prob every
# eval_interval updates and at the end. Remove the block to skip evaluation.
puzzle_eval_files:
  lichess: data/puzzles/mate_in_1_eval.csv
  selfplay: data/puzzles/selfplay_mate_in_1_eval.csv
eval_interval: 50

# Update algorithm: ppo
# PPO (Schulman et al. 2017) with GAE (Schulman et al. 2016). Values from the
# paper's Table 3 (Atari) / Table 5 (MuJoCo), scaled to our batch:
gae_lambda: 0.95          # Tables 3 and 5; 1.0 = today's return-minus-value advantage
clip_epsilon: 0.2         # Table 5 (0.1 in Table 3); trusted ratio band per update
ppo_epochs: 4             # Table 3 uses 3, Table 5 uses 10
ppo_minibatches: 4        # 768 samples / 4 = 192 per minibatch (Table 3: 1024 / 32)
value_coef: 0.5           # eq. 9, c1
normalize_advantage: true # Huang et al. 2022, detail 7 (today's single REINFORCE-with-baseline step per rollout,
# GAE lambda 1) or ppo (see train_ppo.yaml). Keys ppo_epochs, ppo_minibatches,
# clip_epsilon, normalize_advantage, value_coef, gae_lambda override the preset.
algorithm: ppo
# PPO (Schulman et al. 2017) with GAE (Schulman et al. 2016). Values from the
# paper's Table 3 (Atari) / Table 5 (MuJoCo), scaled to our batch:
gae_lambda: 0.95          # Tables 3 and 5; 1.0 = today's return-minus-value advantage
clip_epsilon: 0.2         # Table 5 (0.1 in Table 3); trusted ratio band per update
ppo_epochs: 4             # Table 3 uses 3, Table 5 uses 10
ppo_minibatches: 4        # 768 samples / 4 = 192 per minibatch (Table 3: 1024 / 32)
value_coef: 0.5           # eq. 9, c1
normalize_advantage: true # Huang et al. 2022, detail 7

terminal_rewards:
  win: 2.0
  loss: -2.0
  draw: -0.5

# Halve the rate every lr_decay_interval updates down to min_lr. 1000 keeps a
# 500-update run at a constant rate; min_lr must not exceed learning_rate.
lr_decay_interval: 1000
lr_decay_factor: 0.5
min_lr: 0.00003
log_interval: 10

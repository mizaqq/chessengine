# One network plays both colours on observations oriented to the mover (AlphaZero,
# Silver et al. 2017). false = legacy separate white/black networks.
shared_network: true
# 16 boards since 2026-09-17 (owner: "go with 16 boards"). The checkpoint win matrix
# showed the supervised prior beating every RL checkpoint 88-9 while only 4 of 12
# boards played whole games. Layout since 2026-09-18 (owner: "make puzzle 3, technique 4,
# mid game 5, opening 4") after arm TECH: two technique boards gave ~75 games per
# material set in 120 updates and the held-out technique dial did not leave zero.
num_envs: 16
# Standard budget (owner, 2026-09-16): 7,500 plies per board = 120 updates x 64 plies.
max_updates: 120
# 64 plies x 16 boards = 1,024 samples per update (opponent plies on pool boards
# leave the batch), split into 4 PPO minibatches.
steps_per_update: 64
# 1e-4 for PPO (16 gradient steps per rollout): at 3e-4 a fresh update left the
# clip band after 5 of 16 minibatches and opening entropy fell to 0.2; at 1e-4
# entropy stayed above 0.5 at the same puzzle accuracy (arms C vs C2, 2026-09-16).
learning_rate: 0.0001
seed: 42
env_type: sync

gamma: 0.99
entropy_coef: 0.01
grad_clip: 1.0

# Reward shaping (Ng, Harada & Russell 1999). `potential`: each own move gets
# shaping_scale * (gamma * material(next own position) - material(this position)),
# terminal position counts as 0, so shaping nets to zero over a game and only the
# terminal outcome is real reward. `none`: outcome-only reward (scale 0).
# `none` is the default since 2026-09-17 (owner: "fin3 with shaping off lays the best
# results ... we should make it default"): from the pretrained network the material
# term made the value head a material counter (-2.6 for a side that can mate next
# move) and delivering mate handed back the banked material credit; with shaping
# off, mate-in-one broke a 900-update plateau (0.57 -> 0.64) and decisive games
# doubled (experiments/finishing-curriculum/outcome.md). `potential` remains the
# bootstrap for a blank network (2026-09-15: 0.2 vs 1.0, decisive 13% -> 24%).
shaping: none
shaping_scale: 0.2

# Start-position curriculum (Florensa et al. 2017; Salimans & Chen 2018).
# round(puzzle_fraction * num_envs) boards play one-move puzzle episodes from
# Lichess mate-in-one positions (mate = win, anything else = "puzzle_miss" paying
# the mover puzzle_miss_reward); the other boards play full games from the
# opening. 0 = today's training, 1 = no board ever sees an opening. 0.5 chosen by
# the owner 2026-09-16. Puzzle files: scripts/prepare_puzzles.py (Lichess DB, CC0).
puzzle_fraction: 0.5
# Explicit board count wins over the fraction. 4 of 12 chosen by the owner 2026-09-16.
puzzle_boards: 3
# Puzzle sources with weights. Lichess only (50k human-game positions) is the
# default after the 2026-09-16 A/B: mixing in positions harvested from the models'
# own games (scripts/harvest_positions.py) raised accuracy on those positions but
# lowered Lichess accuracy and did not move the in-game mate rate. To try the mix
# again, add {file: data/puzzles/selfplay_mate_in_1_train.csv, weight: 0.5}.
# Mate-in-two added 2026-09-16 (next curriculum rung): the win counts only when
# the first move is the verified forcing move; a wrong first move ends the
# episode at once as a miss.
# Mate-in-three and -four added 2026-09-17 (owner: forced mates stay won whatever
# the defender replies, unlike human-game mates, so they are the clean conversion
# rung); first move trusted from Lichess, solution line used as the demonstrator.
# Endgame mates added 2026-09-18 (owner: prioritise "the endgames which end in mate"):
# Lichess puzzles themed endgame + mateIn1..5, solution line stored.
puzzle_train_files:
  - {file: data/puzzles/mate_in_1_train.csv, weight: 0.2}
  - {file: data/puzzles/mate_in_2_train.csv, weight: 0.2}
  - {file: data/puzzles/mate_in_3_train.csv, weight: 0.2}
  - {file: data/puzzles/mate_in_4_train.csv, weight: 0.2}
  - {file: data/puzzles/endgame_mate_train.csv, weight: 0.2}
# Terminal reward for a missed mate on a puzzle board. 0 (default) keeps the value
# head honest about still-winning positions; try negative values as an experiment.
puzzle_miss_reward: 0.0
# Held-out mate-in-one sets, reported as <name>_top1 / <name>_mate_prob every
# eval_interval updates and at the end. Remove the block to skip evaluation.
puzzle_eval_files:
  lichess: data/puzzles/mate_in_1_eval.csv
  lichess_m2: data/puzzles/mate_in_2_eval.csv
  lichess_m3: data/puzzles/mate_in_3_eval.csv
  lichess_m4: data/puzzles/mate_in_4_eval.csv
  lichess_end: data/puzzles/endgame_mate_eval.csv
  selfplay: data/puzzles/selfplay_mate_in_1_eval.csv
eval_interval: 50

# Update algorithm. ppo (default since 2026-09-16, arm C2): clipped surrogate
# (Schulman et al. 2017) over GAE advantages (Schulman et al. 2016), preset
# gae_lambda 0.95, clip_epsilon 0.2, ppo_epochs 4, ppo_minibatches 4, value_coef
# 0.5, normalize_advantage true; any of those keys overrides the preset.
# a2c = one unclipped step per rollout with lambda 1 (the pre-PPO update); with
# 64-ply rollouts it takes 4x fewer gradient steps and learned puzzles at 0.32
# vs PPO's 0.42-0.44 from the same plies.
algorithm: ppo
# gae_lambda 1.0 since 2026-09-18 (arms GSL, LAMBDA, GSL2, LONG2): with terminal-only
# rewards and ten-move plans, the win's full credit should reach the setup moves;
# decisive games 21-23 of 40 vs 19, in-game mate 0.31-0.40 vs 0.28, own-game mate-in-one
# up, clip fraction 0.19 and KL 0.03 unchanged. 0.95 was the PPO preset.
gae_lambda: 1.0

# Mid-game start boards (decided 2026-09-16): the boards after the puzzle boards
# start full games from human positions at plies 20-60 (data/games/midgame_starts.csv,
# built by scripts/prepare_games.py). 0 = every game board starts from the opening.
# The owner chose 4 of the 8 game boards for the run from the pretrained network;
# 2 since the finishing boards took 4 (layout 4 puzzle / 4 finishing / 2 mid-game / 2 opening).
midgame_boards: 5
game_start_file: data/games/midgame_starts.csv

# Finishing boards (decided 2026-09-17; reverse curriculum, Florensa et al. 2017).
# The SL+PPO model won material but found 7 of 100 mates-in-one in its own games:
# only 23% of its human training games end in mate (the rest resign or flag), and
# puzzle accuracy did not transfer to its own positions. A finishing board starts
# k plies before a human checkmate (data/finishes, scripts/prepare_finishes.py)
# with the winner to move and plays a full game under a cap of k + finish_cap_margin
# plies; a cap is a draw (-0.5), a mate the normal win. k is drawn from the even
# values up to the current depth, which starts at finish_depth_start and rises by 2
# (up to finish_depth_max) whenever the success rate over the last finish_window
# finishing episodes reaches finish_advance_rate. Sync env only.
finish_boards: 4
# What the finishing boards play. `technique` (default since 2026-09-18, owner: "mating
# with queen, mating with rook ... the bare king stuff should be generated"): generated
# bare-king starts with a forced win by rule, strong side to move, no mate in one,
# success = mate within the set's cap. `human`: rewound human checkmates (nine arms,
# depth 10/20 conversion never moved). The human finishing evaluation stays on either way.
# `mixed`: each finishing board draws its start from finish_mix (technique / human by
# weight); labelled results go to the technique curriculum, human ones to the depth
# curriculum. Added 2026-09-19 for the overnight run LONG3: LONG2 had no human finishing
# board and the conversion dial had nothing to train on.
finish_source: technique
finish_mix: {technique: 0.5, human: 0.5}
technique_sets: [Q, R, RR, QR]
# Plies allowed per set, about twice the perfect-play worst case (KQ 10 moves, KR 16,
# KRR 7, KQR 6). At the exact distance the dial measures perfection; far above it,
# sloppy technique passes.
technique_caps: {Q: 40, R: 60, RR: 40, QR: 40}
# Held-out generated starts per set in the periodic evaluation (fixed positions,
# always level 3 = unconstrained placement).
technique_eval_games: 50
# Start-state curriculum on the generator (owner 2026-09-18, after TECH/TECH2 where the
# held-out rate never left zero): per set, level 0 = weak king in a corner, strong king
# two squares away, pieces within four; 1 = weak king on an edge; 2 = one square from
# an edge; 3 = anywhere. The level rises when the last technique_window CLEAN boards of
# the set (episodes in which the demonstrator never acted) were won at
# technique_advance_rate or better; starts draw a level uniformly in [0, current].
# Arm CURSIL (0.6 over 30, all episodes counted) raced to level 3 on teacher-made wins
# while the held-out rate stayed at zero, hence clean-only and 0.7 over 40.
# false = every start at level 3 (arms TECH, TECH2).
# `good_starts` (default since 2026-09-18 evening, Florensa et al. 2017 Algorithm 1):
# generated positions are bucketed by geometry (weak king's edge distance 0-3, king
# distance 2/3/4+, nearest piece 1-2/3-4/5+; 36 buckets per set); each bucket's clean
# success over the last technique_bucket_window episodes decides its draw weight: 1 if
# unknown or inside [technique_r_min, technique_r_max] ("good starts": won sometimes),
# technique_replay_share if above (do not forget), technique_probe_share if below (let
# hard starts enter). `levels`: the four-rung ladder of arms CURSIL3 / CURSIL_LONG
# (single pieces stalled at one rung). `off`: unconstrained placement. Curriculum state
# is saved as curriculum.json with the checkpoint and reloaded by init_from.
technique_curriculum: good_starts
technique_r_min: 0.1
technique_r_max: 0.9
technique_bucket_window: 20
technique_replay_share: 0.2
technique_probe_share: 0.1
# Unknown buckets are weighted 1 / 0.5 / 0.25 / 0.1 by the weak king's edge distance
# (start near the goal, expand outward, as the paper starts from the goal state); false =
# flat prior (arm GSL, which cold-started at random placement).
technique_warm_start: true
# levels mode only:
technique_level_start: 0
technique_advance_rate: 0.7
technique_window: 40
finish_train_file: data/finishes/finish_train.csv
finish_depth_start: 2
finish_depth_max: 40
finish_advance_rate: 0.6
finish_window: 100
finish_cap_margin: 20
# Held-out conversion rate from rewound positions at fixed depths, reported as
# finish_rate_d<k> every eval_interval. Remove finish_eval_file to skip.
finish_eval_file: data/finishes/finish_eval.csv
finish_eval_depths: [2, 10, 20]
finish_eval_games: 100
# Board roles can change during a run: from `from_update` on, the boards after the
# puzzle boards take the listed roles when they next reset (the rest start from the
# opening). Owner's idea 2026-09-17: run the finishing curriculum first, then hand
# boards back to opening play so the skill is anchored to the full game (Florensa
# et al. keep sampling the original start distribution). Empty = fixed layout.
# Example: [{from_update: 200, finish_boards: 4, midgame_boards: 2}]
layout_schedule: []

# Exploration noise on curriculum boards (decided 2026-09-17). Mate-in-one sat at
# 0.57 for 900 updates: on 35% of puzzles the policy gave the mate < 0.05, so it was
# never played and never rewarded, while the same network reaches 0.90 when told
# the move. Training moves on puzzle and finishing boards are drawn from
# (1 - explore_epsilon) * pi + explore_epsilon * Dir(explore_alpha) over legal moves
# (AlphaZero root noise, Silver et al. 2017 p.14: alpha 0.3 for chess; AlphaGo Zero
# eps 0.25); the stored log-prob is the mixture's, so the PPO ratio is honest. The
# network's own probabilities and evaluation are untouched. 0 = off.
explore_epsilon: 0.0
explore_alpha: 0.3
# puzzle | curriculum (puzzle + finishing) | all. 2026-09-17: `curriculum` flattened the
# policy (see experiments/exploration-noise/outcome.md); `puzzle` is the mechanism test.
explore_boards: curriculum

# Label-guided exploration (owner, 2026-09-17: "okay, agreed on it"). Instead of
# random noise, the behaviour policy plays a demonstrator's move with probability
# guide_epsilon: the puzzle's key move, the human's next move on a finishing board
# while the game still follows the human line, or a rules-engine mate when one
# exists. The update is unchanged and outcome-driven (the stored log-prob is the
# mixture's); the label only lowers the cost of trying the good move (Salimans &
# Chen 2018). Random noise (explore_epsilon) flattened the policy in both arms.
guide_epsilon: 0.0
guide_boards: curriculum

# Game boards end as a draw after this many plies (AlphaZero: "games exceeding a
# maximum number of steps ... were terminated and assigned a drawn outcome").
# Training games ran 200-220 plies into repetition draws; 120 is a first guess.
# null = no cap. Not applied to puzzle boards or to evaluation games.
max_plies: 120

terminal_rewards:
  win: 2.0
  loss: -2.0
  draw: -0.5

# Halve the rate every lr_decay_interval updates down to min_lr. 1000 keeps a
# 500-update run at a constant rate; min_lr must not exceed learning_rate.
lr_decay_interval: 1000
lr_decay_factor: 0.5
min_lr: 0.00003
log_interval: 10

# Opponent pool (Bansal et al. 2017, ICLR 2018 §4.2; experiments/win-matrix 2026-09-17).
# The first opponent_pool_boards game boards after the puzzle and finishing boards
# play the learner against a frozen member of the pool: the supervised prior plus the
# learner's last opponent_pool_size snapshots taken every opponent_snapshot_every
# updates (owner: "every 50 updates and we play against a pool of last 4"). The
# learner's colour is drawn per game; only the learner's plies enter the update.
# 0 boards = plain self-play. Training log: pool_games, pool_score, pool_score_<name>.
opponent_pool_boards: 5
opponent_pool_size: 4
opponent_snapshot_every: 50
opponent_prior: experiments/human-pretraining/sl
# prior_score in the periodic evaluation: games per colour vs opponent_prior, both
# sampling (0 = off). Success for the pool change: >= 0.5 at the end of the run.
prior_eval_games: 20

# Self-imitation (Oh, Guo, Singh & Lee, ICML 2018; owner 2026-09-18: "lets continue with
# self imitation"). The learner's own plies are stored when their episode ends with the
# Monte Carlo return R from the mover's side; after each PPO update sil_updates
# minibatches of sil_batch plies are drawn with priority (R - V)+ and trained with
# -log pi(a|s) (R - V)+ + sil_value_weight * 1/2 (R - V)+^2, weighted by sil_loss_weight,
# so only plies whose past return beat the current value estimate teach, and a rare
# win is learned from many times. Paper's PPO table: 10 x 512 per 20k on-policy samples,
# weight 0.1, value weight 0.01, buffer 50k; scaled to our ~1k samples per update.
# 0 = off. Diagnostics: sil_buffer_size, sil_valid_share, sil_policy_loss, sil_value_loss.
# Risk (paper 5.4): lock-in on a sub-optimal habit; watch game entropy and prior_score.
sil_updates: 4
sil_batch: 256
sil_loss_weight: 0.1
sil_value_weight: 0.01
sil_buffer: 50000
